name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto Android completo
        run: |
          set -e
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GamePlayAIJR"
          include(":app")
          EOF_FILE
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jr.gameplayai"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jr.gameplayai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0-beta"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/proguard-rules.pro)"
          cat > app/proguard-rules.pro <<'EOF_FILE'
          # Keep rules for the app module
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GamePlayAccessibilityService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/strings.xml)"
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">GAME PLAY AI JR</string>
              <string name="service_description">Lee la pantalla del juego elegido y realiza toques automaticos que tu configures.</string>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/xml/accessibility_service_config.xml)"
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/service_description"
              android:notificationTimeout="100" />
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/jr/gameplayai/GamePlayAccessibilityService.kt)"
          cat > app/src/main/java/com/jr/gameplayai/GamePlayAccessibilityService.kt <<'EOF_FILE'
          package com.jr.gameplayai

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.concurrent.ConcurrentLinkedDeque

          class GamePlayAccessibilityService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var tapRunnable: Runnable? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  Log.i(TAG, "BOT JR AccessibilityService conectado")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return

                  val packageName = event.packageName?.toString() ?: "desconocido"
                  val filter = targetPackage
                  if (filter.isNotEmpty() && packageName != filter) return

                  val className = event.className?.toString() ?: "desconocido"
                  val text = event.text.joinToString(separator = ", ") { it.toString() }

                  val line = "type=${event.eventType}, package=$packageName, class=$className, text=$text"
                  events.addFirst(line)
                  while (events.size > MAX_EVENTS) events.pollLast()
              }

              // ---------- Escaneo de pantalla ----------

              fun scanLater(delayMs: Long) {
                  scanResult = listOf("Escaneando en ${delayMs / 1000} s... cambia al juego ahora.")
                  handler.postDelayed({ scanResult = scanScreen() }, delayMs)
              }

              private fun scanScreen(): List<String> {
                  val root = rootInActiveWindow
                      ?: return listOf("Sin ventana activa o la app bloquea la lectura.")
                  val out = mutableListOf<String>()
                  out.add("Paquete en pantalla: ${root.packageName}")
                  walk(root, out)
                  if (out.size == 1) {
                      out.add("No se encontraron botones ni textos. Si es un juego grafico (Unity, etc.), usa toques por coordenadas.")
                  }
                  return out
              }

              private fun walk(node: AccessibilityNodeInfo, out: MutableList<String>) {
                  if (out.size > 300) return
                  val text = node.text?.toString() ?: ""
                  val desc = node.contentDescription?.toString() ?: ""
                  val id = node.viewIdResourceName ?: ""
                  if (text.isNotBlank() || desc.isNotBlank() || node.isClickable) {
                      val r = Rect()
                      node.getBoundsInScreen(r)
                      val kind = if (node.isClickable) "[BOTON]" else "[TEXTO]"
                      out.add("$kind text=$text desc=$desc id=$id centro=${r.centerX()},${r.centerY()}")
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      walk(child, out)
                  }
              }

              // ---------- Toques automaticos ----------

              fun tap(x: Float, y: Float) {
                  val path = Path()
                  path.moveTo(x, y)
                  val stroke = GestureDescription.StrokeDescription(path, 0L, 50L)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  dispatchGesture(gesture, null, null)
              }

              fun startTapping(x: Float, y: Float, intervalMs: Long, maxTaps: Int, startDelayMs: Long) {
                  stopTapping()
                  tapsDone = 0
                  val runnable = object : Runnable {
                      override fun run() {
                          if (tapsDone >= maxTaps) {
                              tapRunnable = null
                              return
                          }
                          tap(x, y)
                          tapsDone += 1
                          handler.postDelayed(this, intervalMs)
                      }
                  }
                  tapRunnable = runnable
                  handler.postDelayed(runnable, startDelayMs)
              }

              fun stopTapping() {
                  tapRunnable?.let { handler.removeCallbacks(it) }
                  tapRunnable = null
              }

              fun isTapping(): Boolean = tapRunnable != null

              override fun onInterrupt() {
                  stopTapping()
              }

              override fun onDestroy() {
                  stopTapping()
                  instance = null
                  super.onDestroy()
              }

              companion object {
                  private const val TAG = "BOTJR"
                  private const val MAX_EVENTS = 50

                  @Volatile
                  var instance: GamePlayAccessibilityService? = null

                  @Volatile
                  var targetPackage: String = ""

                  @Volatile
                  var tapsDone: Int = 0

                  @Volatile
                  var scanResult: List<String> = emptyList()

                  val events = ConcurrentLinkedDeque<String>()
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/jr/gameplayai/MainActivity.kt)"
          cat > app/src/main/java/com/jr/gameplayai/MainActivity.kt <<'EOF_FILE'
          package com.jr.gameplayai

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var log: TextView
              private lateinit var pkgField: EditText
              private lateinit var xField: EditText
              private lateinit var yField: EditText
              private lateinit var intervalField: EditText
              private lateinit var maxField: EditText
              private var showScan = false

              private fun input(hintText: String, value: String, number: Boolean): EditText {
                  val e = EditText(this)
                  e.hint = hintText
                  e.setText(value)
                  if (number) e.inputType = InputType.TYPE_CLASS_NUMBER
                  e.setSingleLine()
                  return e
              }

              private fun button(label: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun label(text: String): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = 14f
                  t.setPadding(0, 24, 0, 0)
                  t.setTypeface(t.typeface, Typeface.BOLD)
                  return t
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  val title = TextView(this)
                  title.text = "GAME PLAY AI JR - BETA"
                  title.textSize = 20f
                  title.setTypeface(title.typeface, Typeface.BOLD)

                  status = TextView(this)
                  status.textSize = 16f
                  status.setPadding(0, pad / 2, 0, pad / 2)

                  pkgField = input("Paquete del juego (ej: com.juego.app)", "", false)
                  xField = input("X", "540", true)
                  yField = input("Y", "1200", true)
                  intervalField = input("Intervalo ms (min 100)", "1000", true)
                  maxField = input("Max toques (1-5000)", "50", true)

                  root.addView(title)
                  root.addView(status)
                  root.addView(button("1. Activar accesibilidad") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  root.addView(label("2. FILTRAR UN JUEGO"))
                  root.addView(pkgField)
                  root.addView(button("Guardar filtro (vacio = todos)") {
                      GamePlayAccessibilityService.targetPackage = pkgField.text.toString().trim()
                      GamePlayAccessibilityService.events.clear()
                      showScan = false
                      render()
                  })
                  root.addView(button("Escanear pantalla en 5 s") {
                      val s = GamePlayAccessibilityService.instance
                      if (s == null) {
                          Toast.makeText(this, "Activa el servicio primero", Toast.LENGTH_SHORT).show()
                      } else {
                          s.scanLater(5000L)
                          showScan = true
                          render()
                          Toast.makeText(this, "Cambia al juego. Vuelve aqui en 6 s y pulsa Actualizar", Toast.LENGTH_LONG).show()
                      }
                  })

                  root.addView(label("3. TOQUES AUTOMATICOS"))
                  root.addView(xField)
                  root.addView(yField)
                  root.addView(intervalField)
                  root.addView(maxField)
                  root.addView(button("Iniciar toques en 5 s") {
                      val s = GamePlayAccessibilityService.instance
                      val x = xField.text.toString().toFloatOrNull()
                      val y = yField.text.toString().toFloatOrNull()
                      val interval = (intervalField.text.toString().toLongOrNull() ?: 1000L).coerceAtLeast(100L)
                      val max = (maxField.text.toString().toIntOrNull() ?: 50).coerceIn(1, 5000)
                      if (s == null) {
                          Toast.makeText(this, "Activa el servicio primero", Toast.LENGTH_SHORT).show()
                      } else if (x == null || y == null) {
                          Toast.makeText(this, "X e Y no validos", Toast.LENGTH_SHORT).show()
                      } else {
                          s.startTapping(x, y, interval, max, 5000L)
                          Toast.makeText(this, "Cambia al juego, empieza en 5 s", Toast.LENGTH_LONG).show()
                          render()
                      }
                  })
                  root.addView(button("PARAR toques") {
                      GamePlayAccessibilityService.instance?.stopTapping()
                      render()
                  })

                  root.addView(label("4. RESULTADOS"))
                  root.addView(button("Actualizar") { render() })
                  root.addView(button("Ver eventos") { showScan = false; render() })
                  root.addView(button("Ver ultimo escaneo") { showScan = true; render() })
                  root.addView(button("PARAR servicio") {
                      val s = GamePlayAccessibilityService.instance
                      s?.stopTapping()
                      s?.disableSelf()
                      GamePlayAccessibilityService.events.clear()
                      render()
                  })

                  log = TextView(this)
                  log.textSize = 12f
                  log.setPadding(0, pad / 2, 0, 0)
                  root.addView(log)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun render() {
                  val s = GamePlayAccessibilityService.instance
                  val active = s != null
                  val tapping = s?.isTapping() == true
                  val filter = GamePlayAccessibilityService.targetPackage
                  status.text = (if (active) "Servicio: ACTIVO" else "Servicio: INACTIVO") +
                      "\nFiltro: " + (if (filter.isEmpty()) "todos" else filter) +
                      "\nToques: " + (if (tapping) "EN CURSO" else "parado") +
                      " (" + GamePlayAccessibilityService.tapsDone + ")"
                  log.text = if (showScan) {
                      GamePlayAccessibilityService.scanResult.joinToString("\n\n")
                  } else {
                      GamePlayAccessibilityService.events.joinToString("\n\n")
                  }
              }
          }
          EOF_FILE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GamePlayAIJR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
