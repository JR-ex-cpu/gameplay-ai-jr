name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto Android completo
        run: |
          set -e
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GamePlayAIJR"
          include(":app")
          EOF_FILE
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jr.gameplayai"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jr.gameplayai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0-beta"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/proguard-rules.pro)"
          cat > app/proguard-rules.pro <<'EOF_FILE'
          # Keep rules for the app module
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GamePlayAccessibilityService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/strings.xml)"
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">GAME PLAY AI JR</string>
              <string name="service_description">Registra eventos de accesibilidad para el agente de automatizaciÃ³n BETA.</string>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/xml/accessibility_service_config.xml)"
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_description"
              android:notificationTimeout="100" />
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/jr/gameplayai/GamePlayAccessibilityService.kt)"
          cat > app/src/main/java/com/jr/gameplayai/GamePlayAccessibilityService.kt <<'EOF_FILE'
          package com.jr.gameplayai

          import android.accessibilityservice.AccessibilityService
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent
          import java.util.concurrent.ConcurrentLinkedDeque

          class GamePlayAccessibilityService : AccessibilityService() {

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  Log.i(TAG, "BOT JR AccessibilityService conectado")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return

                  val packageName = event.packageName?.toString() ?: "desconocido"
                  val className = event.className?.toString() ?: "desconocido"
                  val text = event.text.joinToString(separator = ", ") { it.toString() }

                  val line = "type=${event.eventType}, package=$packageName, class=$className, text=$text"
                  Log.i(TAG, "Evento: $line")

                  events.addFirst(line)
                  while (events.size > MAX_EVENTS) events.pollLast()
              }

              override fun onInterrupt() {
                  Log.i(TAG, "Servicio interrumpido")
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              companion object {
                  private const val TAG = "BOTJR"
                  private const val MAX_EVENTS = 50

                  @Volatile
                  var instance: GamePlayAccessibilityService? = null

                  val events = ConcurrentLinkedDeque<String>()
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/jr/gameplayai/MainActivity.kt)"
          cat > app/src/main/java/com/jr/gameplayai/MainActivity.kt <<'EOF_FILE'
          package com.jr.gameplayai

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var log: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  val title = TextView(this).apply {
                      text = "GAME PLAY AI JR â€” BETA"
                      textSize = 20f
                      setTypeface(typeface, Typeface.BOLD)
                  }
                  status = TextView(this).apply { textSize = 16f; setPadding(0, pad, 0, pad) }

                  val openSettings = Button(this).apply {
                      text = "Activar accesibilidad"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  val refresh = Button(this).apply {
                      text = "Actualizar eventos"
                      setOnClickListener { render() }
                  }
                  val stop = Button(this).apply {
                      text = "PARAR servicio"
                      setOnClickListener {
                          GamePlayAccessibilityService.instance?.disableSelf()
                          GamePlayAccessibilityService.events.clear()
                          render()
                      }
                  }

                  log = TextView(this).apply { textSize = 12f }
                  val scroll = ScrollView(this).apply { addView(log) }

                  root.addView(title)
                  root.addView(status)
                  root.addView(openSettings)
                  root.addView(refresh)
                  root.addView(stop)
                  root.addView(scroll)
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun render() {
                  val active = GamePlayAccessibilityService.instance != null
                  status.text = if (active) "Servicio: ACTIVO" else "Servicio: INACTIVO"
                  log.text = GamePlayAccessibilityService.events.joinToString("\n\n")
              }
          }
          EOF_FILE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GamePlayAIJR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
